name: Macros
options:
  bundleIdPrefix: com.octa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

targets:
  Macros:
    type: application
    platform: iOS
    sources: [Macros, Shared]
    dependencies:
      - target: MacrosWidget
    postCompileScripts:
      - path: tools/inject_secrets.sh
        name: Inject secrets from .env
        basedOnDependencyAnalysis: false
    entitlements:
      path: Macros/Macros.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.octa.macros]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octa.macros
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan food barcodes to log them quickly."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Import your weight history from Apple Health."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Save your weight and nutrition to Apple Health."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Macros
  MacrosWidget:
    type: app-extension
    platform: iOS
    sources: [MacrosWidget, Shared]
    info:
      path: MacrosWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacrosWidget/MacrosWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.octa.macros]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octa.macros.widget
        INFOPLIST_KEY_CFBundleDisplayName: Macros
        SKIP_INSTALL: YES
